name: Build Zygisk Module
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    
    - name: Download Zygisk Header
      run: |
        wget -O src/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp

    - name: Build Dobby from Source
      run: |
        git clone https://github.com/jmpews/Dobby.git --depth 1
        cd Dobby
        mkdir build && cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
        make -j4
        cd ../../
        cp Dobby/include/dobby.h src/dobby.h
        cp Dobby/build/libdobby.a src/libdobby.a

    - name: Build Module
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a ..
        make
